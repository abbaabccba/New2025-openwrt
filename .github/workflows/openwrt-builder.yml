name: Mi Mini LAN SOCKS5
on:
  workflow_dispatch:
concurrency:
  group: mi-mini-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync swig unzip zlib1g-dev file wget patch xz-utils
      - name: Prepare official OpenWrt 24.10
        run: |
          git clone --depth 1 --branch openwrt-24.10 https://github.com/openwrt/openwrt.git source
          cd source
          cp ../feeds.conf.default feeds.conf.default
          sh ../diy-part1.sh
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cp ../.config .config
          cp -r ../files .
          sh ../diy-part2.sh
          make defconfig
          grep -qx 'CONFIG_TARGET_ramips_mt7620_DEVICE_xiaomi_miwifi-mini=y' .config
          grep -qx 'CONFIG_PACKAGE_hev-socks5-tproxy=y' .config
          if grep -Eq '^CONFIG_PACKAGE_(luci|luci-base|uhttpd|ppp|ppp-mod-pppoe)=y$' .config; then
            echo 'Unexpected package enabled'; exit 1
          fi
          grep -qx 'CONFIG_PACKAGE_kmod-nft-tproxy=y' .config
          grep -qx 'CONFIG_PACKAGE_ip-tiny=y' .config
          chmod +x files/etc/init.d/lan-socks files/etc/uci-defaults/90-lan-socks files/usr/libexec/lan-socks-rules
          for script in files/etc/init.d/lan-socks files/etc/uci-defaults/90-lan-socks files/usr/libexec/lan-socks-rules; do sh -n "$script"; done
          cp .config ../resolved.config
          git rev-parse HEAD > ../source-revision.txt
          for feed in packages luci routing telephony; do
            git -C feeds/$feed rev-parse HEAD >> ../source-revision.txt
          done
      - name: Download
        working-directory: source
        run: make download -j8
      - name: Compile
        working-directory: source
        run: make -j2 || make -j1 V=s
      - name: Check image exists
        run: |
          cp source/.config resolved.config
          python3 - <<'PYIMAGE'
          from pathlib import Path
          images = list(Path('source/bin/targets/ramips/mt7620').glob('*xiaomi_miwifi-mini-squashfs-sysupgrade.bin'))
          assert len(images) == 1, images
          assert 0 < images[0].stat().st_size <= 15872 * 1024
          print(images[0], images[0].stat().st_size)
          PYIMAGE
      - uses: actions/upload-artifact@v4
        with:
          name: mi-mini-lan-socks
          path: |
            source/bin/targets/ramips/mt7620/*xiaomi_miwifi-mini*
            source/bin/targets/ramips/mt7620/sha256sums
            resolved.config
            source-revision.txt
          if-no-files-found: error
