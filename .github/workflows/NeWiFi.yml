#
# https://github.com/P3TERX/Actions-OpenWrt
#
# File: .github/workflows/openwrt-builder.yml
# Description: Build OpenWrt / LEDE using GitHub Actions
#
# Based on P3TERX/Actions-OpenWrt
#

name: NeWiFi

on:
  repository_dispatch:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  # ============================================================
  # LEDE source
  # ============================================================
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master

  # Stable commit before:
  # c879083638c7e451a750e6a1e0c8749e6f241d06
  # "ramips: add Linux 6.18 testing support"
  #
  # This commit uses Linux 5.10.265
  REPO_COMMIT: b71ed98b06c59a51b94842ea372655e7dc4ef1aa

  # ============================================================
  # Build configuration
  # ============================================================
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh

  # ============================================================
  # Upload configuration
  # ============================================================
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true

  TZ: Asia/Shanghai


jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ==========================================================
      # Checkout this build repository
      # ==========================================================
      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================================
      # Free disk space
      # ==========================================================
      - name: 释放磁盘空间
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true


      # ==========================================================
      # Initialize environment
      # ==========================================================
      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -e

          sudo rm -rf \
            /etc/apt/sources.list.d/* \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL

          sudo docker image prune --all --force || true

          sudo -E apt-get -qq update

          sudo -E apt-get -qq install \
            ack \
            antlr3 \
            asciidoc \
            autoconf \
            automake \
            autopoint \
            binutils \
            bison \
            build-essential \
            bzip2 \
            ccache \
            cmake \
            cpio \
            curl \
            device-tree-compiler \
            fastjar \
            flex \
            gawk \
            gettext \
            gcc-multilib \
            g++-multilib \
            git \
            gperf \
            haveged \
            help2man \
            intltool \
            libc6-dev-i386 \
            libelf-dev \
            libfuse-dev \
            libglib2.0-dev \
            libgmp3-dev \
            libltdl-dev \
            libmpc-dev \
            libmpfr-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libpython3-dev \
            libreadline-dev \
            libssl-dev \
            libtool \
            lrzsz \
            mkisofs \
            msmtp \
            ninja-build \
            p7zip \
            p7zip-full \
            patch \
            pkgconf \
            python2.7 \
            python3 \
            python3-pyelftools \
            python3-setuptools \
            qemu-utils \
            rsync \
            scons \
            squashfs-tools \
            subversion \
            swig \
            texinfo \
            uglifyjs \
            upx-ucl \
            unzip \
            vim \
            wget \
            xmlto \
            xxd \
            zlib1g-dev

          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean

          sudo timedatectl set-timezone "$TZ"

          sudo mkdir -p /workdir
          sudo chown "$USER":"$(id -gn)" /workdir

          echo "========================================"
          echo "Environment initialized"
          echo "========================================"


      # ==========================================================
      # Clone LEDE and checkout stable commit
      # ==========================================================
      - name: Clone source code
        working-directory: /workdir
        run: |
          set -e

          echo "========================================"
          echo "Disk usage before clone"
          echo "========================================"
          df -hT "$PWD"

          echo
          echo "========================================"
          echo "Clone LEDE"
          echo "========================================"
          echo "Repository : $REPO_URL"
          echo "Branch     : $REPO_BRANCH"
          echo "Commit     : $REPO_COMMIT"

          git clone \
            -b "$REPO_BRANCH" \
            "$REPO_URL" \
            openwrt

          cd openwrt

          echo
          echo "========================================"
          echo "Checkout pinned commit"
          echo "========================================"

          git checkout --detach "$REPO_COMMIT"

          echo
          echo "========================================"
          echo "Current LEDE source"
          echo "========================================"

          git log -1 \
            --pretty=format:'Commit : %H%nDate   : %cd%nSubject: %s' \
            --date=iso

          echo
          echo

          ACTUAL_COMMIT="$(git rev-parse HEAD)"

          echo "Expected commit: $REPO_COMMIT"
          echo "Actual commit  : $ACTUAL_COMMIT"

          if [ "$ACTUAL_COMMIT" != "$REPO_COMMIT" ]; then
            echo "ERROR: LEDE commit verification failed!"
            exit 1
          fi

          echo
          echo "Commit verification OK."

          echo
          echo "========================================"
          echo "Kernel version"
          echo "========================================"

          cat include/kernel-5.10

          if ! grep -Fq 'LINUX_VERSION-5.10 = .265' include/kernel-5.10; then
            echo
            echo "ERROR: Expected Linux 5.10.265!"
            exit 1
          fi

          echo
          echo "Kernel verification OK: Linux 5.10.265"

          echo
          echo "========================================"
          echo "Check ramips legacy overlay files"
          echo "========================================"

          if [ -e target/linux/ramips/files/drivers/gpio/gpio-ralink.c ]; then
            echo "WARNING: gpio-ralink.c overlay exists"
          else
            echo "OK: gpio-ralink.c overlay does not exist"
          fi

          if [ -e target/linux/ramips/files/drivers/spi/spi-rt2880.c ]; then
            echo "WARNING: spi-rt2880.c overlay exists"
          else
            echo "OK: spi-rt2880.c overlay does not exist"
          fi

          if [ -e target/linux/ramips/files/drivers/i2c/busses/i2c-ralink.c ]; then
            echo "WARNING: i2c-ralink.c overlay exists"
          else
            echo "OK: i2c-ralink.c overlay does not exist"
          fi

          echo
          echo "========================================"
          echo "Create workspace symlink"
          echo "========================================"

          ln -sf /workdir/openwrt "$GITHUB_WORKSPACE/openwrt"


      # ==========================================================
      # Load custom feeds
      # ==========================================================
      - name: Load custom feeds
        run: |
          set -e

          if [ -e "$FEEDS_CONF" ]; then
            mv "$FEEDS_CONF" openwrt/feeds.conf.default
          fi

          chmod +x "$DIY_P1_SH"

          cd openwrt

          "$GITHUB_WORKSPACE/$DIY_P1_SH"


      # ==========================================================
      # Update feeds
      # ==========================================================
      - name: Update feeds
        run: |
          set -e

          cd openwrt

          ./scripts/feeds update -a


      # ==========================================================
      # Install feeds
      # ==========================================================
      - name: Install feeds
        run: |
          set -e

          cd openwrt

          ./scripts/feeds install -a


      # ==========================================================
      # Load custom configuration
      # ==========================================================
      - name: Load custom configuration
        run: |
          set -e

          if [ -e files ]; then
            mv files openwrt/files
          fi

          if [ -e "$CONFIG_FILE" ]; then
            mv "$CONFIG_FILE" openwrt/.config
          fi

          chmod +x "$DIY_P2_SH"

          cd openwrt

          "$GITHUB_WORKSPACE/$DIY_P2_SH"

          echo
          echo "========================================"
          echo "Target information"
          echo "========================================"

          grep '^CONFIG_TARGET_ramips' .config || true
          grep '^CONFIG_TARGET.*DEVICE.*=y' .config || true


      # ==========================================================
      # Download packages
      # ==========================================================
      - name: Download package
        id: package
        run: |
          set -e

          cd openwrt

          echo "========================================"
          echo "Run make defconfig"
          echo "========================================"

          make defconfig

          echo
          echo "========================================"
          echo "Target configuration"
          echo "========================================"

          grep '^CONFIG_TARGET_' .config | head -50 || true

          echo
          echo "========================================"
          echo "Download packages"
          echo "========================================"

          make download -j8

          echo
          echo "========================================"
          echo "Check incomplete downloads"
          echo "========================================"

          find dl -size -1024c -exec ls -lh {} \; || true
          find dl -size -1024c -exec rm -f {} \; || true


      # ==========================================================
      # Compile firmware
      # ==========================================================
      - name: Compile the firmware
        id: compile
        run: |
          set -e

          cd openwrt

          echo "========================================"
          echo "Compile OpenWrt"
          echo "========================================"

          echo "$(nproc) thread compile"

          make -j"$(nproc)" || \
          make -j1 || \
          make -j1 V=s

          echo "status=success" >> "$GITHUB_OUTPUT"

          grep '^CONFIG_TARGET.*DEVICE.*=y' .config \
            | sed -r 's/.*DEVICE_(.*)=y/\1/' \
            > DEVICE_NAME || true

          if [ -s DEVICE_NAME ]; then
            echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> "$GITHUB_ENV"
          else
            echo "DEVICE_NAME=" >> "$GITHUB_ENV"
          fi

          echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> "$GITHUB_ENV"


      # ==========================================================
      # Check disk usage
      # ==========================================================
      - name: Check space usage
        if: ${{ !cancelled() }}
        run: |
          df -hT


      # ==========================================================
      # Upload full bin directory
      # ==========================================================
      - name: Upload bin directory
        uses: actions/upload-artifact@v4
        if: ${{ steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true' }}
        with:
          name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: openwrt/bin
          retention-days: 5


      # ==========================================================
      # Organize firmware files
      # ==========================================================
      - name: Organize files
        id: organize
        if: ${{ env.UPLOAD_FIRMWARE == 'true' && steps.compile.outputs.status == 'success' && !cancelled() }}
        run: |
          set -e

          cd openwrt/bin/targets/*/*

          rm -rf packages

          echo "FIRMWARE=$PWD" >> "$GITHUB_ENV"
          echo "status=success" >> "$GITHUB_OUTPUT"

          echo
          echo "========================================"
          echo "Firmware files"
          echo "========================================"

          ls -lh


      # ==========================================================
      # Upload firmware artifact
      # ==========================================================
      - name: Upload firmware directory
        uses: actions/upload-artifact@v4
        if: ${{ steps.organize.outputs.status == 'success' && !cancelled() }}
        with:
          name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: ${{ env.FIRMWARE }}
          retention-days: 5


      # ==========================================================
      # Generate GitHub Release tag
      # ==========================================================
      - name: Generate release tag
        id: tag
        if: ${{ env.UPLOAD_RELEASE == 'true' && steps.organize.outputs.status == 'success' && !cancelled() }}
        run: |
          set -e

          RELEASE_TAG="$(date +"%Y.%m.%d-%H%M")"

          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

          {
            echo "## OpenWrt Firmware"
            echo
            echo "- Build date: $(date '+%Y-%m-%d %H:%M:%S %Z')"
            echo "- LEDE branch: $REPO_BRANCH"
            echo "- LEDE commit: $REPO_COMMIT"
            echo "- Kernel: Linux 5.10.265"
            echo "- Device: ${DEVICE_NAME:-unknown}"
          } > release.txt

          echo "status=success" >> "$GITHUB_OUTPUT"

          echo
          cat release.txt


      # ==========================================================
      # Upload GitHub Release
      # ==========================================================
      - name: Upload firmware to release
        uses: softprops/action-gh-release@v2
        if: ${{ steps.tag.outputs.status == 'success' && !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          body_path: release.txt
          files: ${{ env.FIRMWARE }}/*


      # ==========================================================
      # Delete old workflow runs
      # ==========================================================
      - name: Delete workflow runs
        if: ${{ !cancelled() }}
        uses: Mattraks/delete-workflow-runs@main
        with:
          retain_days: 0
          keep_minimum_runs: 2


      # ==========================================================
      # Delete old Releases
      # ==========================================================
      - name: Remove old Releases
        uses: dev-drprasad/delete-older-releases@master
        if: ${{ env.UPLOAD_RELEASE == 'true' && !cancelled() }}
        with:
          keep_latest: 3
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
